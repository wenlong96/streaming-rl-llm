function ChessPiece({code}){
  // code is like 'wK' for white king. Returns inline SVG sized to the parent square.
  const svg = PIECE_SVGS[code];
  if (!svg) return null;
  return <svg viewBox="0 0 45 45" dangerouslySetInnerHTML={{__html:svg}} />;
}

// Map chess.js piece -> our SVG code
function pieceCode(p){
  if (!p) return null;
  return (p.color === 'w' ? 'w' : 'b') + p.type.toUpperCase();
}

// Difficulty presets. Stockfish skill_level 0-20, we also throttle search depth.
// 'willi' is special — uses opening book + reactions.
const DIFFICULTIES = [
  {id:'willi', label:'Will',         skill:1,  depth:3, randomChance:0.08, isWilli:true},
  {id:'d100',  label:'Beginner',     skill:0,  depth:1, randomChance:0.20},
  {id:'d300',  label:'Casual',       skill:0,  depth:2, randomChance:0.10},
  {id:'d800',  label:'Fair',         skill:3,  depth:5, randomChance:0.03},
  {id:'d1200', label:'Intermediate', skill:8,  depth:8, randomChance:0},
  {id:'d1600', label:'Hard',         skill:14, depth:12, randomChance:0},
];

// Sound effects — preloads chess audio files on mount and provides a play()
// function. Mute state persisted to localStorage. Files are in /sounds/ and
// must be named: move, capture, castle, check, checkmate, promotion,
// game-start, game-end, illegal — extension is figured out at preload time.
const SOUND_EVENTS = ['move','capture','castle','check','checkmate','promotion','game-start','game-end','illegal'];
// Bump this whenever you swap sound packs (run build_sounds.py --pack X).
// The query string forces browsers and Cloudflare to fetch fresh audio rather
// than serve a cached version of the old pack.
const SOUND_VERSION = 1;
function useSoundEffects(){
  const [muted, setMuted] = useState(() => {
    try { return localStorage.getItem('willi_pg_muted') === '1'; } catch { return false; }
  });
  const audiosRef = useRef({}); // event name -> HTMLAudioElement (template, cloned per play)

  // Preload audio files. Try .mp3 first, fall back to .ogg if 404.
  useEffect(() => {
    let cancelled = false;
    SOUND_EVENTS.forEach(ev => {
      const tryExt = (ext) => {
        const a = new Audio(`/sounds/${ev}.${ext}?v=${SOUND_VERSION}`);
        a.preload = 'auto';
        a.volume = 0.5;
        a.addEventListener('canplaythrough', () => {
          if (!cancelled) audiosRef.current[ev] = a;
        }, {once: true});
        a.addEventListener('error', () => {
          if (cancelled) return;
          if (ext === 'mp3') tryExt('ogg');
          // If both fail, just skip — graceful silence
        }, {once: true});
        a.load();
      };
      tryExt('mp3');
    });
    return () => { cancelled = true; };
  }, []);

  const play = useCallback((ev) => {
    if (muted) return;
    const template = audiosRef.current[ev];
    if (!template) return; // file not loaded — silent
    try {
      // Clone so overlapping plays don't queue/cut off
      const clone = template.cloneNode();
      clone.volume = template.volume;
      const p = clone.play();
      // Some browsers return a Promise that rejects on autoplay block — silently swallow
      if (p && p.catch) p.catch(()=>{});
    } catch {}
  }, [muted]);

  const toggleMute = useCallback(() => {
    setMuted(m => {
      const next = !m;
      try { localStorage.setItem('willi_pg_muted', next ? '1' : '0'); } catch {}
      return next;
    });
  }, []);

  return {play, muted, toggleMute};
}

function PlaygroundPage(){
  const [chessLib, setChessLib] = useState(null); // window.Chess constructor when loaded
  const [engineReady, setEngineReady] = useState(false);
  const [reactions, setReactions] = useState(null);
  const [openingBook, setOpeningBook] = useState(null);
  const [imgError, setImgError] = useState(false);
  const sound = useSoundEffects();

  const [difficulty, setDifficulty] = useState('willi');
  const [playerColor, setPlayerColor] = useState('w'); // 'w' or 'b' — which color the user plays
  const [game, setGame] = useState(null); // chess.js instance
  const [boardKey, setBoardKey] = useState(0); // forces re-render after game mutations
  const [selected, setSelected] = useState(null); // 'e2' etc
  const [legalTargets, setLegalTargets] = useState([]); // ['e3','e4',...]
  const [lastMove, setLastMove] = useState(null); // {from, to}
  const [thinking, setThinking] = useState(false);
  const [currentReaction, setCurrentReaction] = useState(null); // {id, text, leaving}
  const [pendingPromotion, setPendingPromotion] = useState(null); // {from, to} when human pawn reaches 8th rank
  const [gameOver, setGameOver] = useState(null);
  // Map of difficulty id -> saved game snapshot {pgn, playerColor, gameOver, lastMove}
  // Lets users switch modes mid-game without losing progress; switching back restores state.
  const [savedGames, setSavedGames] = useState({});
  const [avatarPopping, setAvatarPopping] = useState(false);
  const [history, setHistory] = useState({w:0, l:0, d:0});
  const [showBanner, setShowBanner] = useState(false);

  const engineRef = useRef(null);
  const engineCallbackRef = useRef(null);
  const moveTimerRef = useRef(null);
  const reactCounterRef = useRef(0);
  const reactTimerRef = useRef(null);
  const reactLeaveTimerRef = useRef(null);
  const avatarPopTimerRef = useRef(null);

  const diffMeta = DIFFICULTIES.find(d => d.id === difficulty);
  const isWilli = !!diffMeta?.isWilli;

  // Load chess.js (UMD) once
  useEffect(() => {
    if (window.Chess) { setChessLib(() => window.Chess); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js';
    s.async = true;
    s.onload = () => { if (window.Chess) setChessLib(() => window.Chess); };
    s.onerror = () => { console.error('chess.js failed to load'); };
    document.head.appendChild(s);
  }, []);

  const [engineError, setEngineError] = useState(false);

  // Spin up Stockfish web worker once.
  // We fetch the script first and wrap it in a Blob URL because browsers won't
  // allow `new Worker(crossOriginUrl)` directly. Blob URLs are same-origin.
  useEffect(() => {
    if (engineRef.current) return;
    let worker = null;
    let timeoutId = null;
    let blobUrl = null;
    let cancelled = false;

    const setup = async () => {
      try {
        const res = await fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js', {mode: 'cors'});
        if (!res.ok) throw new Error('fetch returned ' + res.status);
        const text = await res.text();
        if (cancelled) return;
        const blob = new Blob([text], {type: 'application/javascript'});
        blobUrl = URL.createObjectURL(blob);
        worker = new Worker(blobUrl);
      } catch (e) {
        console.error('Stockfish failed to load:', e);
        setEngineError(true);
        return;
      }

      // Surface error if the engine doesn't say 'readyok' within 25 seconds
      timeoutId = setTimeout(() => {
        if (!engineReady && !cancelled) {
          console.warn('Stockfish never became ready within 25s');
          setEngineError(true);
        }
      }, 25000);

      worker.onmessage = (e) => {
        const line = typeof e.data === 'string' ? e.data : (e.data?.data || '');
        if (line === 'uciok') worker.postMessage('isready');
        if (line === 'readyok') {
          setEngineReady(true);
          if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
        }
        const m = line.match(/^bestmove\s+(\S+)/);
        if (m && engineCallbackRef.current) {
          const cb = engineCallbackRef.current;
          engineCallbackRef.current = null;
          cb(m[1]);
        }
      };
      worker.onerror = (err) => {
        console.error('Stockfish worker error:', err);
        setEngineError(true);
      };
      worker.postMessage('uci');
      engineRef.current = worker;
    };

    setup();

    return () => {
      cancelled = true;
      if (timeoutId) clearTimeout(timeoutId);
      try { worker?.terminate(); } catch{}
      if (blobUrl) URL.revokeObjectURL(blobUrl);
    };
  }, []);

  // Lazy load reactions + opening book (WiLLi mode only — but loading is cheap so do it once)
  useEffect(() => {
    fetch('/reactions.json').then(r => r.ok ? r.json() : null).then(setReactions).catch(()=>setReactions({}));
    fetch('/opening_book.json').then(r => r.ok ? r.json() : null).then(setOpeningBook).catch(()=>setOpeningBook({}));
  }, []);

  // Init game once chess lib is loaded
  useEffect(() => {
    if (!chessLib) return;
    setGame(new chessLib());
  }, [chessLib]);

  // First-visit disclaimer
  useEffect(() => {
    try {
      if (!localStorage.getItem('willi_pg_seen')) setShowBanner(true);
    } catch {}
  }, []);
  const dismissBanner = () => {
    setShowBanner(false);
    try { localStorage.setItem('willi_pg_seen','1'); } catch {}
  };

  // Restore match history
  useEffect(() => {
    try {
      const h = localStorage.getItem('willi_pg_record');
      if (h) setHistory(JSON.parse(h));
    } catch {}
  }, []);
  const updateHistory = (delta) => {
    setHistory(prev => {
      const next = {...prev, ...delta};
      Object.keys(delta).forEach(k => { next[k] = (prev[k]||0) + delta[k]; });
      try { localStorage.setItem('willi_pg_record', JSON.stringify(next)); } catch {}
      return next;
    });
  };

  // Show a single reaction popup. Replaces any current one.
  // Auto-dismisses after a duration that scales with text length.
  const pushReaction = (text) => {
    if (reactTimerRef.current) clearTimeout(reactTimerRef.current);
    if (reactLeaveTimerRef.current) clearTimeout(reactLeaveTimerRef.current);
    if (avatarPopTimerRef.current) clearTimeout(avatarPopTimerRef.current);
    reactCounterRef.current += 1;
    setCurrentReaction({id: reactCounterRef.current, text, leaving: false});
    // Avatar pop animation — restart by toggling the class off then back on
    setAvatarPopping(false);
    requestAnimationFrame(() => setAvatarPopping(true));
    avatarPopTimerRef.current = setTimeout(() => setAvatarPopping(false), 600);
    // Duration: 2.5s base + 50ms per char, capped at 8s
    const duration = Math.min(2500 + text.length * 50, 8000);
    reactTimerRef.current = setTimeout(() => {
      setCurrentReaction(prev => prev ? {...prev, leaving: true} : null);
      reactLeaveTimerRef.current = setTimeout(() => {
        setCurrentReaction(null);
      }, 300);
    }, duration);
  };

  const fireReactionForEvent = (eventKey) => {
    if (!isWilli || !reactions) return;
    const lines = reactions[eventKey];
    if (!lines || !lines.length) return;
    const pick = lines[Math.floor(Math.random() * lines.length)];
    pushReaction(pick);
  };

  // Ask Stockfish for a move at the current FEN. Returns a Promise of UCI move like 'e2e4'.
  const askEngine = (fen, opts) => new Promise((resolve) => {
    if (!engineRef.current || !engineReady) { resolve(null); return; }
    engineCallbackRef.current = resolve;
    const w = engineRef.current;
    w.postMessage(`setoption name Skill Level value ${opts.skill}`);
    w.postMessage(`position fen ${fen}`);
    w.postMessage(`go depth ${opts.depth}`);
  });

  // Pick a move from the opening book if one exists for this position. Returns
  // a UCI move or null. Frequencies are weights — sample proportionally.
  const consultOpeningBook = (fen) => {
    if (!openingBook || !openingBook.positions) return null;
    const key = fen.split(' ').slice(0,2).join(' '); // strip move counters for matching
    const moves = openingBook.positions[key];
    if (!moves || !moves.length) return null;
    const total = moves.reduce((a,m) => a + m.weight, 0);
    let r = Math.random() * total;
    for (const m of moves) {
      r -= m.weight;
      if (r <= 0) return m.uci;
    }
    return moves[0].uci;
  };

  // Apply a move (from chess.js move object) to the game and update UI
  const applyMove = (mv) => {
    setLastMove({from: mv.from, to: mv.to});
    setBoardKey(k => k + 1);

    // Pick a single sound based on the move's character. chess.js encodes
    // move type in mv.flags: 'k' kingside castle, 'q' queenside castle,
    // 'p' promotion, 'c' capture, 'e' en passant capture, etc.
    // Priority: checkmate/draw > check > castle > promotion > capture > move
    const flags = mv.flags || '';
    const isCastle = flags.includes('k') || flags.includes('q');
    const isPromotion = !!mv.promotion;
    const isCapture = !!mv.captured;

    // Game-over checks
    if (game.in_checkmate()) {
      const winnerIsHuman = mv.color === playerColor;
      setGameOver({result: winnerIsHuman?'win':'loss', reason:'checkmate'});
      sound.play('checkmate');
      if (winnerIsHuman) { fireReactionForEvent('on_loss'); updateHistory({w:1}); }
      else { fireReactionForEvent('on_win'); updateHistory({l:1}); }
    } else if (game.in_stalemate() || game.in_threefold_repetition() || game.insufficient_material() || game.in_draw()) {
      setGameOver({result:'draw', reason: game.in_stalemate()?'stalemate':'draw'});
      sound.play('game-end');
      fireReactionForEvent('on_draw');
      updateHistory({d:1});
    } else if (game.in_check()) {
      sound.play('check');
      // mv.color is who just moved (delivered the check)
      if (mv.color === playerColor) fireReactionForEvent('your_check');
      else fireReactionForEvent('their_check');
    } else if (isCastle) {
      sound.play('castle');
    } else if (isPromotion) {
      sound.play('promotion');
    } else if (isCapture) {
      sound.play('capture');
    } else {
      sound.play('move');
    }
  };

  const botColor = playerColor === 'w' ? 'b' : 'w';

  // Bot's turn: pick move (book or engine), apply with cosmetic delay
  const botMove = () => {
    if (!game || game.game_over()) return;
    if (game.turn() !== botColor) return;
    setThinking(true);
    const moveNum = Math.ceil(game.history().length / 2);

    // Cosmetic delay shaped roughly like a human ELO-600 player thinks:
    // fast in opening, slower in middlegame, occasional "long think", quicker in endgame.
    let baseMin, baseMax;
    if (moveNum <= 6) { baseMin = 500; baseMax = 1500; }
    else if (moveNum <= 15) { baseMin = 2000; baseMax = 5000; }
    else if (moveNum <= 25) { baseMin = 2000; baseMax = 7000; }
    else { baseMin = 1000; baseMax = 3000; }
    if (Math.random() < 0.10 && moveNum > 10) { baseMax += 7000; } // rare long think
    const delay = baseMin + Math.random() * (baseMax - baseMin);

    // Decide the move now (may be near-instant from book, or short engine call)
    const decideAsync = async () => {
      let uci = null;
      // Try opening book first (WiLLi mode only, opening phase)
      if (isWilli && moveNum <= 8) uci = consultOpeningBook(game.fen());
      // Random move chance — for low difficulty / WiLLi flavor
      if (!uci && Math.random() < (diffMeta.randomChance || 0)) {
        const moves = game.moves({verbose:true});
        if (moves.length) {
          const r = moves[Math.floor(Math.random()*moves.length)];
          uci = r.from + r.to + (r.promotion || '');
        }
      }
      // Otherwise engine
      if (!uci) uci = await askEngine(game.fen(), {skill: diffMeta.skill, depth: diffMeta.depth});
      return uci;
    };
    decideAsync().then(uci => {
      moveTimerRef.current = setTimeout(() => {
        if (!uci) { setThinking(false); return; }
        const from = uci.slice(0,2), to = uci.slice(2,4), promotion = uci.slice(4) || undefined;
        const beforeFen = game.fen();
        const mv = game.move({from, to, promotion: promotion || 'q'});
        if (mv) {
          // Reactions for capture / first-move / blunder
          if (moveNum === 1 && isWilli) fireReactionForEvent('opening');
          if (mv.captured) fireReactionForEvent('their_capture');
          applyMove(mv);
        }
        setThinking(false);
      }, delay);
    });
  };

  // Trigger bot move when it becomes the bot's turn
  useEffect(() => {
    if (!game || !engineReady) return;
    if (game.turn() === botColor && !game.game_over() && !gameOver) {
      botMove();
    }
    return () => { if (moveTimerRef.current) clearTimeout(moveTimerRef.current); };
    // eslint-disable-next-line
  }, [boardKey, engineReady, game, botColor]);

  // Click handling: select piece, then click a target square to move
  const handleSquareClick = (sq) => {
    if (!game || gameOver || thinking || pendingPromotion) return;
    if (game.turn() !== playerColor) return;
    // If clicking the selected square again, deselect
    if (selected === sq) { setSelected(null); setLegalTargets([]); return; }
    // If a piece is selected and the click is on a legal target, move
    if (selected && legalTargets.includes(sq)) {
      const movingPiece = game.get(selected);
      const promoRank = playerColor === 'w' ? '8' : '1';
      const isPromotion = movingPiece && movingPiece.type === 'p' && sq[1] === promoRank;
      if (isPromotion) {
        setPendingPromotion({from: selected, to: sq});
        return;
      }
      const mv = game.move({from: selected, to: sq});
      if (mv) {
        setSelected(null); setLegalTargets([]);
        if (mv.captured && isWilli) fireReactionForEvent('your_capture');
        applyMove(mv);
      }
      return;
    }
    // Otherwise try to select a piece on the clicked square
    const piece = game.get(sq);
    if (piece && piece.color === playerColor) {
      const moves = game.moves({square: sq, verbose: true});
      setSelected(sq);
      setLegalTargets(moves.map(m => m.to));
    } else {
      setSelected(null); setLegalTargets([]);
    }
  };

  // Complete a pawn promotion the user just chose
  const choosePromotion = (pieceType) => {
    if (!pendingPromotion) return;
    const mv = game.move({from: pendingPromotion.from, to: pendingPromotion.to, promotion: pieceType});
    setPendingPromotion(null);
    setSelected(null); setLegalTargets([]);
    if (mv) {
      if (mv.captured && isWilli) fireReactionForEvent('your_capture');
      applyMove(mv);
    }
  };

  // Helper: snapshot the current game so we can restore it later
  const snapshotCurrentGame = () => {
    if (!game) return null;
    return {
      pgn: game.pgn(),
      playerColor,
      gameOver,
      lastMove,
    };
  };

  // Restore a snapshotted game by replaying its PGN
  const restoreGame = (snap) => {
    if (!chessLib || !snap) return false;
    const restored = new chessLib();
    try {
      restored.load_pgn(snap.pgn);
    } catch {
      return false;
    }
    setGame(restored);
    setPlayerColor(snap.playerColor || 'w');
    setLastMove(snap.lastMove || null);
    setGameOver(snap.gameOver || null);
    setSelected(null); setLegalTargets([]); setPendingPromotion(null);
    setBoardKey(k => k + 1);
    return true;
  };

  const newGame = (colorOverride) => {
    if (moveTimerRef.current) clearTimeout(moveTimerRef.current);
    if (reactTimerRef.current) clearTimeout(reactTimerRef.current);
    if (reactLeaveTimerRef.current) clearTimeout(reactLeaveTimerRef.current);
    if (!chessLib) return;
    const newColor = colorOverride || playerColor;
    setGame(new chessLib());
    setPlayerColor(newColor);
    setSelected(null); setLegalTargets([]); setLastMove(null);
    setGameOver(null); setThinking(false);
    setCurrentReaction(null);
    setPendingPromotion(null);
    // Clear saved game for this mode — they explicitly started fresh
    setSavedGames(prev => {
      const next = {...prev};
      delete next[difficulty];
      return next;
    });
    sound.play('game-start');
    if (isWilli) fireReactionForEvent('on_start');
    setBoardKey(k => k + 1);
  };

  const switchColor = (color) => {
    if (color === playerColor) return;
    // Switching color always starts a new game in this mode
    newGame(color);
  };

  // Switch to a different difficulty. Saves the current game's state under the
  // current difficulty so it can be returned to. If the target difficulty has
  // a saved state, restore it; otherwise start fresh.
  const switchDifficulty = (newId) => {
    if (newId === difficulty) return;
    if (moveTimerRef.current) clearTimeout(moveTimerRef.current);
    setThinking(false);
    setCurrentReaction(null);
    setPendingPromotion(null);
    setSelected(null); setLegalTargets([]);

    // Save current game (only if it has any moves OR is over — don't bother saving an untouched fresh board)
    const snap = snapshotCurrentGame();
    const movesSoFar = game?.history().length || 0;
    setSavedGames(prev => {
      const next = {...prev};
      if (movesSoFar > 0 || gameOver) {
        next[difficulty] = snap;
      } else {
        delete next[difficulty];
      }
      return next;
    });

    setDifficulty(newId);
    // Restore saved state for new mode if any, else fresh game
    const saved = savedGames[newId];
    if (saved) {
      restoreGame(saved);
    } else if (chessLib) {
      const fresh = new chessLib();
      setGame(fresh);
      setLastMove(null);
      setGameOver(null);
      setBoardKey(k => k + 1);
    }
  };

  // Build board squares — render from player's perspective.
  // White at bottom: ranks 8..1, files a..h.
  // Black at bottom: ranks 1..8, files h..a.
  const renderBoard = () => {
    if (!game) return <div className="pg-loading">Loading board…</div>;
    const filesAH = ['a','b','c','d','e','f','g','h'];
    const isBlackPov = playerColor === 'b';
    const fileOrder = isBlackPov ? [...filesAH].reverse() : filesAH;
    const rankOrder = isBlackPov ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];

    const squares = [];
    const checkColor = game.in_check() ? game.turn() : null;
    let kingSq = null;
    if (checkColor) {
      // Find the king under check
      for (const f of filesAH) for (let r=1;r<=8;r++) {
        const sq = f+r;
        const p = game.get(sq);
        if (p && p.type === 'k' && p.color === checkColor) { kingSq = sq; break; }
      }
    }
    rankOrder.forEach((r, ri) => {
      fileOrder.forEach((f, fi) => {
        const sq = f + r;
        // Square color: a1 is dark; alternates by file+rank parity. Reuse standard.
        const fileIdx = filesAH.indexOf(f);
        const isLight = (fileIdx + r) % 2 === 1;
        const piece = game.get(sq);
        const cls = ['pg-sq', isLight?'light':'dark'];
        if (selected === sq) cls.push('selected');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) cls.push('last-move');
        if (legalTargets.includes(sq)) cls.push(piece ? 'legal-capture' : 'legal-move');
        if (kingSq === sq) cls.push('in-check');
        // Show rank label on the leftmost column of the rendered board
        // and file label on the bottommost row of the rendered board.
        const showRankLabel = fi === 0;
        const showFileLabel = ri === 7;
        squares.push(
          <div key={sq} className={cls.join(' ')} onClick={() => handleSquareClick(sq)}>
            {showRankLabel && <span className="pg-rank-label">{r}</span>}
            {showFileLabel && <span className="pg-file-label">{f}</span>}
            {piece && <ChessPiece code={pieceCode(piece)} />}
          </div>
        );
      });
    });
    return <div className="pg-board">{squares}</div>;
  };

  // SAN moves grouped by full move number for the scoresheet
  const moveHistoryRows = (() => {
    if (!game) return [];
    const moves = game.history(); // array of SAN strings
    const rows = [];
    for (let i = 0; i < moves.length; i += 2) {
      rows.push({n: Math.floor(i/2)+1, w: moves[i], b: moves[i+1] || ''});
    }
    return rows;
  })();

  return (
    <div className="pg-wrap">
      {showBanner && (
        <div className="pg-banner">
          <span>Will is in gaming mode here. Expect a bit of nonsense but all in good fun.</span>
          <button onClick={dismissBanner} aria-label="Dismiss">×</button>
        </div>
      )}

      <div className="pg-head">
        <div>
          <h1>Chess</h1>
          <div className="pg-sub" style={{marginTop:'0.35rem'}}>Pick an opponent · Click to move</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'0.85rem'}}>
          <div className="pg-record">
            Record vs Will: <span style={{color:'var(--text-2)'}}>{history.w}W</span> · <span style={{color:'var(--text-2)'}}>{history.l}L</span> · <span style={{color:'var(--text-2)'}}>{history.d}D</span>
          </div>
          <button onClick={sound.toggleMute} title={sound.muted ? 'Unmute sounds' : 'Mute sounds'} aria-label={sound.muted ? 'Unmute sounds' : 'Mute sounds'} style={{
            background:'none',border:'1px solid var(--border-2)',borderRadius:5,
            padding:'0.35rem 0.5rem',cursor:'pointer',
            color:sound.muted?'var(--text-4)':'var(--text-2)',
            display:'inline-flex',alignItems:'center',justifyContent:'center',
            transition:'all 0.15s',lineHeight:0,
          }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.color='var(--text)';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-2)';e.currentTarget.style.color=sound.muted?'var(--text-4)':'var(--text-2)';}}
          >
            {sound.muted ? (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            )}
          </button>
        </div>
      </div>

      <div className="pg-diff">
        {DIFFICULTIES.map(d => (
          <button
            key={d.id}
            className={`${d.id===difficulty?'active ':''}${d.isWilli?'willi-mode':''}`}
            onClick={() => switchDifficulty(d.id)}
          >{d.label}</button>
        ))}
      </div>

      <div className="pg-color-toggle">
        <span>Play as</span>
        <button className={playerColor==='w'?'active':''} onClick={() => switchColor('w')}>
          <span className="pg-color-dot white"/> White
        </button>
        <button className={playerColor==='b'?'active':''} onClick={() => switchColor('b')}>
          <span className="pg-color-dot black"/> Black
        </button>
      </div>

      <div className="pg-board-col">
        <div className="pg-board-wrap">
          {renderBoard()}

          {/* Persistent avatar + reaction bubble at top-right of board */}
          {isWilli && (
            <div className="pg-avatar-anchor">
              <div className={`pg-react-avatar${avatarPopping?' popping':''}`}>
                {!imgError ? (
                  <img src="site_photo.jfif" alt="Will" onError={() => setImgError(true)}/>
                ) : (
                  <div className="fallback">W</div>
                )}
              </div>
              {currentReaction && (
                <div className={`pg-react-bubble${currentReaction.leaving?' leaving':''}`}>
                  {currentReaction.text}
                </div>
              )}
            </div>
          )}

          {/* Promotion picker overlay */}
          {pendingPromotion && (
            <div className="pg-promo-overlay">
              <div className="pg-promo-card">
                {['q','r','b','n'].map(p => (
                  <button key={p} onClick={() => choosePromotion(p)} title={({q:'Queen',r:'Rook',b:'Bishop',n:'Knight'})[p]}>
                    <ChessPiece code={playerColor + p.toUpperCase()} />
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="pg-status">
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.45rem'}}>
            {engineError ? (
              <span style={{color:'#c87878'}}>Engine failed to load. Try refreshing.</span>
            ) : !engineReady ? (
              <span>Loading engine…</span>
            ) : gameOver ? (
              <span>{gameOver.result==='win'?'You won':gameOver.result==='loss'?'You lost':'Draw'}</span>
            ) : thinking ? (
              <>
                <span>{diffMeta.label} is thinking</span>
                <span className="pg-thinking-dots"><span/><span/><span/></span>
              </>
            ) : pendingPromotion ? (
              <span style={{color:'var(--gold)'}}>Choose a piece to promote to</span>
            ) : game?.turn() === playerColor ? (
              <>
                <span className="turn-dot your-turn"/>
                <span>Your turn</span>
              </>
            ) : (
              <span>Their turn</span>
            )}
          </span>
          <span style={{fontFamily:'var(--mono)',fontSize:'0.6rem',color:'var(--text-4)'}}>
            {game ? `Move ${Math.ceil(game.history().length/2)+1}` : ''}
          </span>
        </div>

        {gameOver && (
          <div className="pg-result">
            <span>
              {gameOver.result === 'win' && '🏁 You won by ' + gameOver.reason + '.'}
              {gameOver.result === 'loss' && 'Defeat by ' + gameOver.reason + '.'}
              {gameOver.result === 'draw' && 'Drawn — ' + gameOver.reason + '.'}
            </span>
            <button onClick={() => newGame()}>Rematch</button>
          </div>
        )}

        <div className="pg-controls">
          <button onClick={() => newGame()}>New game</button>
        </div>

        {/* Move history scoresheet */}
        <div className="pg-history">
          <div className="pg-history-label">Moves</div>
          {moveHistoryRows.length === 0 ? (
            <div className="pg-history-empty">No moves yet.</div>
          ) : (
            <div className="pg-history-table">
              {moveHistoryRows.map(row => (
                <React.Fragment key={row.n}>
                  <div className="num">{row.n}.</div>
                  <div className="move">{row.w}</div>
                  <div className="move">{row.b}</div>
                </React.Fragment>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [route,rawNav]=useRoute();
  const dirRef = useRef('none');
  const prevRouteRef = useRef(route);
  const ROUTE_ORDER = ['/home','/chat','/architecture','/projects','/playground','/admin'];

  const nav = (newRoute) => {
    if (newRoute === prevRouteRef.current) return;
    const oi = ROUTE_ORDER.indexOf(prevRouteRef.current);
    const ni = ROUTE_ORDER.indexOf(newRoute);
    dirRef.current = ni >= oi ? 'right' : 'left';
    prevRouteRef.current = newRoute;
    rawNav(newRoute);
  };
  const [adminAuthed, setAdminAuthed] = useState(() => {
    try { return sessionStorage.getItem('willi_admin')==='1'; } catch { return false; }
  });
  const doLogin = () => {
    try { sessionStorage.setItem('willi_admin','1'); } catch {}
    setAdminAuthed(true);
    dirRef.current = 'right';
    prevRouteRef.current = '/chat';
    rawNav('/chat');
  };
  const doLogout = () => {
    try { sessionStorage.removeItem('willi_admin'); } catch {}
    setAdminAuthed(false);
  };
  const pages={
    '/home':<HomePage nav={nav}/>,
    '/chat':<ChatPage adminAuthed={adminAuthed} onLogout={doLogout}/>,
    '/architecture':<ArchitecturePage/>,
    '/projects':<ProjectsPage nav={nav}/>,
    '/playground':<PlaygroundPage/>,
    '/admin':<AdminPage adminAuthed={adminAuthed} onLogin={doLogin} onLogout={doLogout}/>,
  };
  const anim = dirRef.current === 'right'
    ? 'pageFromRight 0.32s ease-out both'
    : dirRef.current === 'left'
    ? 'pageFromLeft 0.32s ease-out both'
    : 'fi 0.3s ease';
  return (
    <>
      <Nav route={route} nav={nav}/>
      <div key={route} style={{animation:anim}}>
        {pages[route]||pages['/home']}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
